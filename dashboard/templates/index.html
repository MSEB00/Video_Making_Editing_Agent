<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaming Video Agent - Pro Video Editor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://js.puter.com/v2/"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 21, 33, 0.85);
      --card-border: rgba(139, 92, 246, 0.2);
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 85%, rgba(6, 182, 212, 0.1) 0%, transparent 45%);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: rgba(13, 16, 26, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo-badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      box-shadow: 0 4px 18px rgba(139, 92, 246, 0.4);
    }
    .header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 40%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .pro-tag {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
    }
    .header-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #34d399;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }
    .status-badge.disconnected {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.25);
      color: #f87171;
    }
    .status-badge.disconnected .status-dot {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: none;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    .stat-pill {
      font-size: 0.78rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      display: none;
    }
    @media (min-width: 860px) {
      .stat-pill { display: block; }
    }

    /* Editor Settings Bar */
    .editor-bar {
      background: rgba(18, 21, 33, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.6rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      font-size: 0.82rem;
    }
    .editor-control-group {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .control-label {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .control-select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      border-radius: 8px;
      padding: 0.3rem 0.7rem;
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .control-select:focus, .control-select:hover {
      border-color: var(--accent-purple);
      background: rgba(139, 92, 246, 0.15);
    }
    .control-select option {
      background: #11131f;
      color: #fff;
    }

    /* Quick Action Chips */
    .quick-actions {
      display: flex;
      gap: 0.5rem;
      padding: 0.6rem 2rem;
      background: rgba(10, 13, 20, 0.5);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      overflow-x: auto;
    }
    .chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border-radius: 20px;
      padding: 0.35rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .chip:hover {
      background: rgba(139, 92, 246, 0.18);
      border-color: rgba(139, 92, 246, 0.45);
      color: #fff;
      transform: translateY(-1px);
    }
    .chip.highlight {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.2));
      border-color: rgba(139, 92, 246, 0.4);
      color: #fff;
      font-weight: 600;
    }

    /* Chat Area */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }
    .chat-container::-webkit-scrollbar { width: 6px; }
    .chat-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
    }

    /* Message Bubbles */
    .message-row {
      display: flex;
      gap: 0.75rem;
      max-width: 85%;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message-row.agent {
      align-self: flex-start;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .message-row.agent .avatar {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(59, 130, 246, 0.3));
      border: 1px solid rgba(139, 92, 246, 0.4);
    }
    .message-row.user .avatar {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.3), rgba(16, 185, 129, 0.3));
      border: 1px solid rgba(6, 182, 212, 0.4);
    }

    .msg-content {
      padding: 0.85rem 1.15rem;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-row.user .msg-content {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
    }

    .message-row.agent .msg-content {
      background: rgba(20, 24, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .message-row.agent.greeting .msg-content {
      border-left: 3px solid var(--accent-purple);
    }
    .message-row.agent.success .msg-content {
      border-left: 3px solid var(--accent-green);
      background: rgba(16, 185, 129, 0.06);
    }
    .message-row.agent.error .msg-content {
      border-left: 3px solid var(--accent-red);
      background: rgba(239, 68, 68, 0.08);
    }

    /* Video player card in chat */
    .video-card {
      margin-top: 0.9rem;
      background: rgba(10, 12, 20, 0.95);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    .video-card video {
      width: 100%;
      max-height: 420px;
      display: block;
      background: #000;
      outline: none;
    }
    .video-footer {
      padding: 0.85rem 1.15rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .video-info {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .btn-download {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      text-decoration: none;
      padding: 0.45rem 1.1rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .btn-download:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .feedback-controls {
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .feedback-controls button, .feedback-controls select {
      font: inherit;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
    }
    .feedback-controls button { cursor: pointer; }
    .feedback-controls button:hover { border-color: var(--accent-green); }
    .feedback-controls select { max-width: 12rem; }
    .feedback-controls span { color: var(--text-muted); font-size: 0.78rem; }

    /* Step updates (Live progress) */
    .step-pill {
      align-self: flex-start;
      margin-left: 44px;
      background: rgba(20, 24, 38, 0.75);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 8px;
      padding: 0.45rem 0.9rem;
      font-size: 0.82rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      animation: slideUp 0.2s ease-out;
      font-family: 'JetBrains Mono', monospace;
    }
    .step-pill .icon { font-size: 1.05rem; }

    /* Input Bar */
    .input-wrapper {
      padding: 1rem 2rem;
      background: rgba(13, 16, 26, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .input-form {
      display: flex;
      gap: 0.75rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    .input-form input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 0.85rem 1.25rem;
      font-size: 0.92rem;
      color: #fff;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    .input-form input:focus {
      border-color: var(--accent-purple);
      background: rgba(139, 92, 246, 0.08);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }
    .input-form input::placeholder {
      color: #64748b;
    }

    .btn-send {
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      padding: 0 1.5rem;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
    }
    .btn-send:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo-badge">⚡</div>
      <div>
        <h1>
          Gaming Video Agent
          <span class="pro-tag">PRO EDITOR</span>
        </h1>
        <div class="header-subtitle">Automated Video Assembly • Transitions • BGM Mixing • Formatting</div>
      </div>
    </div>
    <div class="header-right">
      <a href="/research" style="color:#cbd5e1;text-decoration:none;font-size:.82rem;font-weight:600">Reference research</a>
      <div class="stat-pill" id="statPill">Checking assets...</div>
      <div class="status-badge" id="statusBadge">
        <div class="status-dot"></div>
        <span id="statusText">Connecting...</span>
      </div>
    </div>
  </header>

  <!-- Interactive Editor Toolbar -->
  <div class="editor-bar">
    <div class="editor-control-group">
      <span class="control-label">✨ Transition:</span>
      <select id="selTransition" class="control-select">
        <option value="random" selected>Randomized per cut</option>
        <option value="fade">Smooth Fade (Crossfade)</option>
        <option value="wipeleft">Wipe Left</option>
        <option value="slideleft">Slide Left</option>
        <option value="dissolve">Dissolve</option>
        <option value="circlecrop">Circle Crop</option>
        <option value="none">Direct Cut (No transition)</option>
      </select>
    </div>

    <div class="editor-control-group">
      <span class="control-label">🎵 BGM Music:</span>
      <select id="selBgm" class="control-select">
        <option value="auto" selected>AI selects for this footage</option>
        <option value="energetic">Energetic feel</option>
        <option value="chill">Chill feel</option>
        <option value="cinematic">Cinematic feel</option>
        <option value="trending">Trending licensed catalog (Jamendo)</option>
        <option value="none">No BGM (Game Audio Only)</option>
      </select>
    </div>

    <div class="editor-control-group">
      <span class="control-label">📱 Format:</span>
      <select id="selAspect" class="control-select">
        <option value="16:9">16:9 Landscape (YouTube)</option>
        <option value="9:16" selected>9:16 Vertical (YouTube Shorts / Instagram Reels)</option>
      </select>
    </div>
  </div>

  <!-- Quick Action Chips -->
  <div class="quick-actions">
    <button class="chip highlight" onclick="quickSend('make transitions and add bgm')">⚡ Make Transitions & BGM</button>
    <button class="chip" onclick="quickSend('make a shorts video with wipe transitions and lofi music')">📱 Shorts / Reels (9:16)</button>
    <button class="chip" onclick="quickSend('make a random edit with trending audio')">🎲 Random Shorts + Trending Audio</button>
    <button class="chip" onclick="quickSend('make a montage with random transitions and epic music')">🔄 Random Transitions Montage</button>
    <button class="chip" onclick="quickSend('list clips')">📂 Available Clips</button>
    <button class="chip" onclick="quickSend('status')">📊 Job Status</button>
  </div>

  <!-- Chat Area -->
  <main class="chat-container" id="chatContainer"></main>

  <!-- Input Bar -->
  <footer class="input-wrapper">
    <form class="input-form" id="chatForm" onsubmit="event.preventDefault(); sendMessage();">
      <input 
        id="userInput" 
        type="text" 
        placeholder="Type an editing request... (e.g. 'make transitions and add bgm', 'add wipe transition')" 
        autocomplete="off" 
      />
      <button type="submit" class="btn-send" id="sendBtn">
        <span>Send</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </footer>

  <script>
    const socket = io();
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const statPill = document.getElementById('statPill');

    const selTransition = document.getElementById('selTransition');
    const selBgm = document.getElementById('selBgm');
    const selAspect = document.getElementById('selAspect');

    function scrollBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function addMessage(text, role, type = '', media = null) {
      const row = document.createElement('div');
      row.className = `message-row ${role} ${type}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? '👤' : '🤖';

      const content = document.createElement('div');
      content.className = 'msg-content';
      content.textContent = text;

      if (media && media.video_url) {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <video controls preload="metadata" playsinline>
            <source src="${media.video_url}" type="video/mp4">
            Your browser does not support HTML5 video.
          </video>
          <div class="video-footer">
            <span class="video-info">🎬 ${media.filename || 'Rendered Video'} (${media.size_mb || '0'} MB)</span>
            <a href="${media.video_url}" download="${media.filename || 'video.mp4'}" class="btn-download">
              ⬇️ Download MP4
            </a>
          </div>
        `;
        const feedback = document.createElement('div');
        feedback.className = 'feedback-controls';
        const tagSelect = document.createElement('select');
        tagSelect.multiple = true;
        tagSelect.setAttribute('aria-label', 'Edit feedback tags');
        [
          ['too_many_effects', 'Too many effects'], ['too_slow', 'Too slow'],
          ['too_fast', 'Too fast'], ['bgm_mismatch', 'BGM does not fit'],
          ['captions_good', 'Captions are good'], ['transitions_bad', 'Transitions are bad'],
          ['hook_good', 'Hook is good']
        ].forEach(([value, label]) => {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = label;
          tagSelect.appendChild(option);
        });
        const feedbackStatus = document.createElement('span');
        feedbackStatus.setAttribute('aria-live', 'polite');
        [-1, 1].forEach(rating => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = rating > 0 ? '👍 Good' : '👎 Needs work';
          button.addEventListener('click', async () => {
            const response = await fetch('/api/feedback', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({
                edit_id: media.job_id,
                rating,
                tags: Array.from(tagSelect.selectedOptions, option => option.value)
              })
            });
            feedbackStatus.textContent = response.ok ? 'Feedback recorded' : 'Could not record feedback';
          });
          feedback.appendChild(button);
        });
        feedback.append(tagSelect, feedbackStatus);
        card.appendChild(feedback);
        content.appendChild(card);
      }

      row.appendChild(avatar);
      row.appendChild(content);
      chatContainer.appendChild(row);
      scrollBottom();
    }

    function addStep(icon, msg) {
      const pill = document.createElement('div');
      pill.className = 'step-pill';
      pill.innerHTML = `<span class="icon">${icon}</span><span>${msg}</span>`;
      chatContainer.appendChild(pill);
      scrollBottom();
    }

    function quickSend(txt) {
      userInput.value = txt;
      sendMessage();
    }

    function sendMessage() {
      const msg = userInput.value.trim();
      if (!msg) return;

      const currentOptions = {
        transition_type: selTransition.value,
        bgm_track: selBgm.value === 'none' ? null : selBgm.value,
        aspect_ratio: selAspect.value,
        bgm_volume: 0.30,
        color_grade: true
      };

      addMessage(msg, 'user');
      socket.emit('chat_message', {
        msg: msg,
        options: currentOptions
      });
      userInput.value = '';
      userInput.focus();
    }

    // Socket events
    socket.on('connect', () => {
      statusBadge.classList.remove('disconnected');
      statusText.textContent = 'Agent Online';
    });

    socket.on('disconnect', () => {
      statusBadge.classList.add('disconnected');
      statusText.textContent = 'Disconnected';
    });

    socket.on('status', data => {
      if (data.msg) {
        statPill.textContent = data.msg;
      }
    });

    socket.on('chat_response', data => {
      const media = data.video_url ? {
        video_url: data.video_url,
        filename: data.filename,
        size_mb: data.size_mb,
        job_id: data.job_id
      } : null;
      addMessage(data.msg, 'agent', data.type || '', media);
    });

    socket.on('agent_step', data => {
      addStep(data.icon, data.msg);
    });

    window.addEventListener('DOMContentLoaded', () => {
      userInput.focus();
    });
  </script>
  <script src="/static/puter_ai.js"></script>
</body>
</html>
