# Bounds for the context-aware creative planner and renderer.
creative_editing:
  default_game: "valorant"
  default_platform: "youtube_shorts"
  supported_platforms:
    - "youtube_shorts"
    - "instagram_reels"
  max_source_videos: 12
  max_planned_shots: 24
  max_short_duration_seconds: 60
  jamendo_candidate_limit: 20
  max_revision_passes: 1
  # Align planned shots to detected gameplay events (e.g. VALORANT kills):
  # buildup before, event as payoff near shot end, hold after, never cut mid-event.
  # Assemble shots in recording chronology (source order, then position within
  # source) so the match story stays consistent for viewers. The planner still
  # SELECTS moments freely; only the ordering is normalized. Set false (or use
  # `edit --order impact`) to keep planner-chosen cold-open ordering.
  chronological_shot_order: true
  # Every indexed source clip contributes at least one shot (session recap).
  # The planner still selects moments; missing sources get event-anchored
  # shots constructed automatically. 'edit --source-clips selected' opts out.
  full_session_coverage: true
  align_to_gameplay_events: true
  event_hold_seconds: 1.0
  event_max_snap_shift_seconds: 6.0
  event_detection_games:
    - "valorant"
  review_render: true
  learned_examples_path: "data/editing_examples.jsonl"
  minimum_reference_examples: 5
  reference_training_path: "training/youtube"
  youtube_discovery_max_per_channel: 3

youtube_research:
  enabled: false
  interval_seconds: 86400

training_timeline:
  allowed_aggregate_features:
    - "cut_density"
    - "caption_density"
    - "visual_emphasis"
    - "dead_space_tolerance"
    - "early_payoff_seconds"
  retain_creator_identity: false